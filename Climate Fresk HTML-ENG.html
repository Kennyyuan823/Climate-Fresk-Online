<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Climate Fresk Online</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
<style>
*{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
.app{
  display:flex;
  flex-direction:column;
  height:100vh;
  overflow:hidden;
}
header{
  background:#047857;
  color:white;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  flex-wrap:wrap;
}
header h1{
  font-size:17px;
  font-weight:bold;
  margin:0;
}
.header-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
button{
  cursor:pointer;
  border:none;
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
}
.btn-primary{
  background:white;
  color:#047857;
  font-weight:bold;
}
.btn-danger{
  background:#ef4444;
  color:white;
  font-weight:bold;
}
.btn-warning{
  background:#f59e0b;
  color:white;
  font-weight:bold;
}
.btn-success{
  background:#10b981;
  color:white;
  font-weight:bold;
}
.btn-reset{
  background:#6366f1;
  color:white;
  font-weight:bold;
}
.main-area{
  flex:1;
  display:flex;
  overflow:hidden;
}
.library{
  width:200px;
  background:#f1f5f9;
  border-right:1px solid #cbd5e1;
  padding:12px;
  overflow-y:auto;
  flex-shrink:0;
}
.library h3{
  font-size:14px;
  font-weight:bold;
  color:#334155;
  margin:0 0 10px 0;
}
.card{
  background:white;
  border:1px solid #d1d5db;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  padding:8px;
  font-size:11px;
  line-height:1.35;
  color:#111827;
  box-sizing:border-box;
  width:130px;
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.lib-card{
  cursor:grab;
  margin-bottom:8px;
}
.board-wrap{
  flex:1;
  position:relative;
  overflow:auto;
  background:#f8fafc;
  background-image:radial-gradient(#cbd5e1 1px,transparent 1px);
  background-size:30px 30px;
}
.board-content{
  position:relative;
  width:2400px;
  height:1500px;
}
.slot{
  position:absolute;
  width:130px;
  height:74px;
  border:2px dashed #94a3b8;
  border-radius:10px;
  background:rgba(255,255,255,.45);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:auto;
}
.slot.occupied{
  border-style:solid;
  border-color:#10b981;
  background:#ecfdf5;
}
.slot-card{
  width:126px;
  height:70px;
  cursor:pointer;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
}
.slot-card.selected{
  outline:2px solid #10b981;
  outline-offset:2px;
}
svg#arrowLayer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:2;
}
.context-menu{
  position:absolute;
  background:white;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
  z-index:100;
  padding:6px 0;
  min-width:190px;
  display:none;
}
.context-menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:10px 12px;
  background:none;
  border:none;
  font-size:13px;
  color:#111827;
}
.context-menu button:hover{
  background:#f3f4f6;
}
.link-tip{
  position:fixed;
  top:64px;
  left:50%;
  transform:translateX(-50%);
  background:#059669;
  color:white;
  padding:8px 14px;
  border-radius:999px;
  font-size:13px;
  z-index:200;
  display:none;
}
.drag-ghost{
  position:absolute;
  opacity:.72;
  pointer-events:none;
  z-index:600;
  width:130px;
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
}
.mobile-bar{
  display:none;
}
.drawer-mask{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:90;
  display:none;
}
.drawer{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  max-height:60vh;
  background:white;
  z-index:91;
  transform:translateY(100%);
  transition:.25s;
  padding:12px;
  box-sizing:border-box;
  overflow-y:auto;
}
.drawer.open{
  transform:translateY(0);
}
.drawer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.drawer-header h3{
  font-size:14px;
  font-weight:bold;
  margin:0;
}
@media (max-width: 768px){
  .library{display:none;}
  .mobile-bar{
    display:flex;
    padding:10px;
    background:#047857;
    gap:8px;
    flex-shrink:0;
    flex-wrap:wrap;
  }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>🌍 Climate Fresk</h1>
    </div>
    <div class="header-buttons">
      <button class="btn-success" id="showAnswerBtn">Show standard answer</button>
      <button class="btn-warning" id="undoAnswerBtn">Undo standard answer</button>
      <button class="btn-primary" id="checkArrowBtn">Check my arrows</button>
      <button class="btn-danger" id="clearAllBtn">Return all cards</button>
      <button class="btn-reset" id="fullResetBtn">Reset whole canvas</button>
    </div>
  </header>

  <div class="main-area">
    <aside class="library">
      <h3>Card library</h3>
      <div id="cardPool"></div>
    </aside>

    <div class="board-wrap" id="boardWrap">
      <div class="board-content" id="boardContent">
        <svg id="arrowLayer"></svg>
        <div id="slotsContainer"></div>
      </div>
    </div>
  </div>

  <div class="mobile-bar">
    <button class="btn-success" id="mobileShowAnswer">Show answer</button>
    <button class="btn-warning" id="mobileUndoAnswer">Undo answer</button>
    <button class="btn-primary" id="mobileCheckArrow">Check arrows</button>
    <button class="btn-danger" id="mobileClearBtn">Return all</button>
    <button class="btn-reset" id="mobileFullResetBtn">Reset canvas</button>
  </div>
</div>

<div class="link-tip" id="linkTip">👉 Click another occupied slot to finish connection</div>

<div class="drawer-mask" id="drawerMask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h3>Card library</h3>
    <button id="closeDrawerBtn">Close</button>
  </div>
  <div id="mobileCardPool"></div>
</div>

<div class="context-menu" id="contextMenu">
  <button id="returnBtn">Return to card library</button>
  <button id="linkBtn">Connect to another card slot</button>
</div>

<script>
// Official Climate Fresk English card texts
const enCardTexts = [
  "Human activities","Fossil fuel use","CO₂ emissions","Additional greenhouse effect","Rising temperatures",
  "Sea‑level rise","Industry","Building use","Transport","Deforestation",
  "Agriculture","Other GHG emissions","Natural carbon sinks","Ocean acidification","Glacier melt",
  "Ocean warming","Water cycle disruption","Terrestrial biodiversity","River floods","Marine biodiversity",
  "Cyclones","Droughts","Saltwater intrusion","Freshwater resources","Crop yield decline",
  "Heatwaves","Famine","Human health","Human migration","Armed conflicts","Permafrost"
];
const TOTAL_CARD_COUNT = enCardTexts.length;
const nameToId = {};
enCardTexts.forEach((name,idx)=>nameToId[name]=idx);

// ===== Standard causal relationships A→B (from original doc, English) =====
const standardRelationsText = [
  ["Human activities","Industry"],["Human activities","Building use"],["Human activities","Transport"],["Human activities","Agriculture"],
  ["Industry","Fossil fuel use"],["Building use","Fossil fuel use"],["Transport","Fossil fuel use"],
  ["Fossil fuel use","CO₂ emissions"],["Deforestation","CO₂ emissions"],["CO₂ emissions","Natural carbon sinks"],
  ["Agriculture","Deforestation"],["Other GHG emissions","Additional greenhouse effect"],["Natural carbon sinks","Additional greenhouse effect"],["Natural carbon sinks","Ocean acidification"],
  ["Additional greenhouse effect","Rising temperatures"],["Glacier melt","Sea‑level rise"],["Glacier melt","Freshwater resources"],
  ["Ocean warming","Sea‑level rise"],["Ocean warming","Marine biodiversity"],["Ocean warming","Cyclones"],
  ["Water cycle disruption","Terrestrial biodiversity"],["Water cycle disruption","River floods"],["Water cycle disruption","Droughts"],
  ["Rising temperatures","Water cycle disruption"],["Rising temperatures","Terrestrial biodiversity"],["Rising temperatures","Heatwaves"],["Rising temperatures","Permafrost"],["Rising temperatures","Glacier melt"],["Rising temperatures","Ocean warming"],
  ["Sea‑level rise","Saltwater intrusion"],["Ocean acidification","Marine biodiversity"],["Terrestrial biodiversity","Crop yield decline"],
  ["River floods","Freshwater resources"],["River floods","Crop yield decline"],["Marine biodiversity","Famine"],
  ["Droughts","Crop yield decline"],["Freshwater resources","Crop yield decline"],["Crop yield decline","Famine"],
  ["Saltwater intrusion","Human migration"],["Cyclones","Saltwater intrusion"],["Heatwaves","Human health"],
  ["Famine","Human health"],["Famine","Human migration"],["Human health","Famine"],["Human health","Armed conflicts"],
  ["Human migration","Armed conflicts"],["Human migration","Famine"],["Armed conflicts","Human migration"],["Armed conflicts","Human health"],["Permafrost","Other GHG emissions"]
];
const standardRelations = standardRelationsText.map(([a,b])=>[nameToId[a],nameToId[b]]);

const TOTAL_SLOTS = 31;
const SLOT_W = 130;
const SLOT_H = 74;

// Slot layout (same positions as Chinese version)
let getDefaultSlotList = ()=>[
  {x:60, y:40, cardId:null},
  {x:380, y:40, cardId:null},
  {x:60, y:220, cardId:null},
  {x:320, y:220, cardId:null},
  {x:580, y:220, cardId:null},
  {x:840, y:220, cardId:null},
  {x:1140, y:220, cardId:null},
  {x:1440, y:220, cardId:null},
  {x:1740, y:220, cardId:null},
  {x:60, y:440, cardId:null},
  {x:320, y:440, cardId:null},
  {x:580, y:440, cardId:null},
  {x:840, y:440, cardId:null},
  {x:1100, y:440, cardId:null},
  {x:1360, y:440, cardId:null},
  {x:1620, y:440, cardId:null},
  {x:1880, y:440, cardId:null},
  {x:60, y:660, cardId:null},
  {x:440, y:660, cardId:null},
  {x:740, y:660, cardId:null},
  {x:1040, y:660, cardId:null},
  {x:1300, y:660, cardId:null},
  {x:1560, y:660, cardId:null},
  {x:440, y:900, cardId:null},
  {x:700, y:900, cardId:null},
  {x:960, y:900, cardId:null},
  {x:1220, y:900, cardId:null},
  {x:1480, y:900, cardId:null},
  {x:1740, y:900, cardId:null},
  {x:1200, y:1140, cardId:null},
  {x:1500, y:1140, cardId:null},
];

let slotList = getDefaultSlotList();

const connections = [];
let availableCardIds = new Set();
function resetAvailableAll(){
  availableCardIds = new Set(enCardTexts.map((_,i)=>i));
}
function syncAvailableBySlots(){
  resetAvailableAll();
  slotList.forEach(slot=>{
    if(slot.cardId!==null){
      availableCardIds.delete(slot.cardId);
    }
  })
}

let selectedSlotIdx = null;
let linkMode = false;
let linkStartIdx = null;
let snapshotUserConnections = [];
let isShowingAnswer = false;

let $ = s=>document.querySelector(s);
let $$ = s=>document.querySelectorAll(s);
let boardContent, slotsContainer, arrowLayer, cardPool, mobileCardPool, contextMenu, linkTip;

function renderSlots(){
  if(!slotsContainer) return;
  slotsContainer.innerHTML = "";
  slotList.forEach((slot,idx)=>{
    const div = document.createElement("div");
    div.className = "slot" + (slot.cardId!==null?" occupied":"");
    div.dataset.idx = idx;
    div.style.left = slot.x + "px";
    div.style.top = slot.y + "px";
    if(slot.cardId!==null){
      const card = document.createElement("div");
      card.className = "slot-card";
      card.textContent = enCardTexts[slot.cardId];
      card.dataset.slotIdx = idx;
      div.appendChild(card);
    }
    slotsContainer.appendChild(div);
  })
}

function renderCardPool(){
  if(!cardPool || !mobileCardPool){
    console.error("Card library DOM not found!");
    return;
  }
  cardPool.innerHTML = "";
  mobileCardPool.innerHTML = "";
  availableCardIds.forEach(id=>{
    const txt = enCardTexts[id];
    const c1 = document.createElement("div");
    c1.className = "card lib-card";
    c1.textContent = txt;
    c1.dataset.cardId = id;
    cardPool.appendChild(c1);
    const c2 = c1.cloneNode(true);
    mobileCardPool.appendChild(c2);
  })
  bindDrag();
}

function bindDrag(){
  if(!window.interact) return;
  interact('.lib-card').unset();
  interact('.lib-card').draggable({
    inertia:false,
    listeners:{
      move(e){
        const ghost = e.target.cloneNode(true);
        ghost.classList.add("drag-ghost");
        document.body.appendChild(ghost);
        ghost.style.left = e.clientX - 65 + "px";
        ghost.style.top = e.clientY - 37 + "px";
        function moveGhost(ev){
          ghost.style.left = ev.clientX -65 +"px";
          ghost.style.top = ev.clientY -37 +"px";
        }
        function upGhost(){
          ghost.remove();
          document.removeEventListener("mousemove",moveGhost);
          document.removeEventListener("mouseup",upGhost);
        }
        document.addEventListener("mousemove",moveGhost);
        document.addEventListener("mouseup",upGhost);
      },
      end(e){
        if(isShowingAnswer) return;
        const cardId = parseInt(e.target.dataset.cardId);
        const drop = document.elementFromPoint(e.clientX,e.clientY)?.closest(".slot");
        if(!drop) return;
        const slotIdx = parseInt(drop.dataset.idx);
        if(slotList[slotIdx].cardId !== null) return;
        slotList[slotIdx].cardId = cardId;
        availableCardIds.delete(cardId);
        renderSlots();
        renderCardPool();
        redrawArrows();
        saveData();
      }
    }
  })
}

function getSlotCenter(idx){
  const s = slotList[idx];
  return {x:s.x + SLOT_W/2, y:s.y + SLOT_H/2};
}
function getSlotEdge(fromIdx,toIdx){
  const fc = getSlotCenter(fromIdx);
  const tc = getSlotCenter(toIdx);
  const dx = tc.x - fc.x;
  const dy = tc.y - fc.y;
  const len = Math.sqrt(dx*dx+dy*dy);
  return {
    x: fc.x + dx/len * (SLOT_W/2-4),
    y: fc.y + dy/len * (SLOT_H/2-4)
  }
}

function hasSlotBetween(aIdx,bIdx){
  const a = slotList[aIdx];
  const b = slotList[bIdx];
  const minX = Math.min(a.x,b.x);
  const maxX = Math.max(a.x,b.x);
  const midY = (a.y+b.y)/2;
  const yTol = 80;
  for(let i=0;i<slotList.length;i++){
    if(i===aIdx || i===bIdx) continue;
    const s = slotList[i];
    if(s.x > minX && s.x < maxX && Math.abs(s.y - midY) < yTol){
      return true;
    }
  }
  return false;
}

function redrawArrows(overrideColorMap=null){
  if(!arrowLayer) return;
  arrowLayer.innerHTML = `
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#334155"/>
      </marker>
      <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
      </marker>
    </defs>
  `;
  connections.forEach((conn,connIndex)=>{
    const fIdx = conn.fromSlot;
    const tIdx = conn.toSlot;
    const fromEdge = getSlotEdge(fIdx,tIdx);
    const toEdge = getSlotEdge(tIdx,fIdx);
    const fCenter = getSlotCenter(fIdx);
    const tCenter = getSlotCenter(tIdx);
    const dy = Math.abs(fCenter.y - tCenter.y);
    const sameRow = dy < 80;
    let useStraight = false;
    if(sameRow){
      const blocked = hasSlotBetween(fIdx,tIdx);
      if(!blocked) useStraight = true;
    }
    let strokeColor = "#334155";
    let markerId = "url(#arrow)";
    if(overrideColorMap && overrideColorMap[connIndex]){
      strokeColor = overrideColorMap[connIndex].color;
      markerId = overrideColorMap[connIndex].marker;
    }else if(conn.strokeColor){
      strokeColor = conn.strokeColor;
      markerId = conn.strokeColor==="#10b981" ? "url(#arrowGreen)" : "url(#arrow)";
    }

    if(useStraight){
      const line = document.createElementNS("http://www.w3.org/2000/svg","line");
      line.setAttribute("x1",fromEdge.x);
      line.setAttribute("y1",fromEdge.y);
      line.setAttribute("x2",toEdge.x);
      line.setAttribute("y2",toEdge.y);
      line.setAttribute("stroke",strokeColor);
      line.setAttribute("stroke-width","2");
      line.setAttribute("marker-end",markerId);
      arrowLayer.appendChild(line);
    }else{
      const midX = (fCenter.x + tCenter.x)/2;
      const midY = (fCenter.y + tCenter.y)/2;
      const dx = Math.abs(tCenter.x - fCenter.x);
      const off = dx>dy ? 60 : 30;
      let ctrlY = midY - off;
      if(Math.abs(tCenter.y-fCenter.y)<60) ctrlY = midY + off;
      const path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d",`M ${fromEdge.x} ${fromEdge.y} Q ${midX} ${ctrlY} ${toEdge.x} ${toEdge.y}`);
      path.setAttribute("fill","none");
      path.setAttribute("stroke",strokeColor);
      path.setAttribute("stroke-width","2");
      path.setAttribute("marker-end",markerId);
      arrowLayer.appendChild(path);
    }
  })
}

function bindCanvasClick(){
  if(!slotsContainer) return;
  slotsContainer.addEventListener("click",e=>{
    if(isShowingAnswer) return;
    const cardEl = e.target.closest(".slot-card");
    if(!cardEl) {
      contextMenu.style.display = "none";
      return;
    }
    const slotIdx = parseInt(cardEl.dataset.slotIdx);
    if(linkMode){
      if(slotList[slotIdx].cardId!==null && slotIdx!==linkStartIdx){
        connections.push({fromSlot:linkStartIdx, toSlot:slotIdx});
        redrawArrows();
        saveData();
      }
      linkMode = false;
      linkStartIdx = null;
      linkTip.style.display = "none";
      return;
    }
    selectedSlotIdx = slotIdx;
    contextMenu.style.left = e.pageX+"px";
    contextMenu.style.top = e.pageY+"px";
    contextMenu.style.display = "block";
  })
}

function returnCardToLibrary(slotIdx){
  const cid = slotList[slotIdx].cardId;
  if(cid===null) return;
  availableCardIds.add(cid);
  slotList[slotIdx].cardId = null;
  for(let i=connections.length-1;i>=0;i--){
    const c = connections[i];
    if(c.fromSlot === slotIdx || c.toSlot === slotIdx){
      connections.splice(i,1);
    }
  }
  renderSlots();renderCardPool();redrawArrows();saveData();
  contextMenu.style.display="none";
}

function returnAllCardsToLibrary(){
  if(isShowingAnswer) return;
  for(let i=0;i<TOTAL_SLOTS;i++){
    const cid = slotList[i].cardId;
    if(cid!==null){
      availableCardIds.add(cid);
      slotList[i].cardId = null;
    }
  }
  connections.length = 0;
  renderSlots();renderCardPool();redrawArrows();saveData();
}

function fullResetCanvas(){
  localStorage.removeItem("cf-answer-check");
  slotList = getDefaultSlotList();
  resetAvailableAll();
  connections.length = 0;
  snapshotUserConnections = [];
  isShowingAnswer = false;
  selectedSlotIdx=null;linkMode=false;linkStartIdx=null;
  renderSlots();
  renderCardPool();
  redrawArrows();
}

function showStandardAnswer(){
  if(isShowingAnswer) return;
  snapshotUserConnections = JSON.parse(JSON.stringify(connections));
  connections.length = 0;
  const cardIdToSlot = new Map();
  slotList.forEach((slot,slotIdx)=>{
    if(slot.cardId!==null) cardIdToSlot.set(slot.cardId, slotIdx);
  });
  standardRelations.forEach(([fromCardId,toCardId])=>{
    const fromSlot = cardIdToSlot.get(fromCardId);
    const toSlot = cardIdToSlot.get(toCardId);
    if(fromSlot!==undefined && toSlot!==undefined && fromSlot!==toSlot){
      connections.push({fromSlot, toSlot, isStandard:true, strokeColor:"#334155"});
    }
  })
  isShowingAnswer = true;
  redrawArrows();
  alert("✅ Standard‑answer arrows displayed.\nClick [Undo standard answer] to restore your own arrows.\n⚠️ While showing answer you cannot drag cards, draw connections or return cards.");
}

function undoStandardAnswer(){
  if(!isShowingAnswer){
    alert("No standard answer is currently displayed, no need to undo.");
    return;
  }
  connections.length = 0;
  connections.push(...JSON.parse(JSON.stringify(snapshotUserConnections)));
  isShowingAnswer = false;
  snapshotUserConnections = [];
  redrawArrows();
  alert("✅ Undone. Back to your own canvas, you may continue editing.");
}

function checkUserArrows(){
  if(isShowingAnswer){
    alert("⚠️ Please click [Undo standard answer] first and return to your canvas before checking arrows.");
    return;
  }
  const slotToCardId = new Map();
  slotList.forEach((slot,slotIdx)=>{
    if(slot.cardId!==null) slotToCardId.set(slotIdx, slot.cardId);
  });
  const standardKeySet = new Set();
  standardRelations.forEach(([a,b])=>standardKeySet.add(`${a}-${b}`));
  const colorMap = {};
  connections.forEach((conn,idx)=>{
    const fCard = slotToCardId.get(conn.fromSlot);
    const tCard = slotToCardId.get(conn.toSlot);
    if(fCard===undefined || tCard===undefined){
      colorMap[idx] = {color:"#334155",marker:"url(#arrow)"};
      return;
    }
    const key = `${fCard}-${tCard}`;
    if(standardKeySet.has(key)){
      colorMap[idx] = {color:"#10b981",marker:"url(#arrowGreen)"};
    }else{
      colorMap[idx] = {color:"#334155",marker:"url(#arrow)"};
    }
  })
  redrawArrows(colorMap);
  alert("✅ Check complete!\n🟢 Green arrow = fully correct causal link.\n⚫ Black arrow = extra / wrong direction / missing card on slot.\nYou can modify your canvas and re‑check any time.");
}

function saveData(){
  const payload = {slotList,connections};
  localStorage.setItem("cf-answer-check", JSON.stringify(payload));
}

function bindAllButtons(){
  $("#showAnswerBtn").onclick = showStandardAnswer;
  $("#undoAnswerBtn").onclick = undoStandardAnswer;
  $("#checkArrowBtn").onclick = checkUserArrows;
  $("#clearAllBtn").onclick = returnAllCardsToLibrary;
  $("#fullResetBtn").onclick = fullResetCanvas;

  $("#mobileShowAnswer").onclick = showStandardAnswer;
  $("#mobileUndoAnswer").onclick = undoStandardAnswer;
  $("#mobileCheckArrow").onclick = checkUserArrows;
  $("#mobileClearBtn").onclick = returnAllCardsToLibrary;
  $("#mobileFullResetBtn").onclick = fullResetCanvas;

  $("#returnBtn").onclick = ()=>{
    if(isShowingAnswer||selectedSlotIdx===null) return;
    returnCardToLibrary(selectedSlotIdx);
  };
  $("#linkBtn").onclick = ()=>{
    if(isShowingAnswer||selectedSlotIdx===null) return;
    linkMode = true;
    linkStartIdx = selectedSlotIdx;
    linkTip.style.display="block";
    contextMenu.style.display="none";
  };

  $("#openDrawerBtn").onclick = ()=>$("#drawer").classList.add("open");
  $("#closeDrawerBtn").onclick = ()=>$("#drawer").classList.remove("open");
  $("#drawerMask").onclick = ()=>$("#drawer").classList.remove("open");
}

function initApp(){
  console.log("🌍 Climate Fresk: DOM ready, initializing");
  boardContent = $("#boardContent");
  slotsContainer = $("#slotsContainer");
  arrowLayer = $("#arrowLayer");
  cardPool = $("#cardPool");
  mobileCardPool = $("#mobileCardPool");
  contextMenu = $("#contextMenu");
  linkTip = $("#linkTip");

  localStorage.removeItem("cf-answer-check");
  fullResetCanvas();

  bindCanvasClick();
  bindAllButtons();
}

document.addEventListener("DOMContentLoaded",initApp);
</script>
</body>
</html>
